:root{--g:#14193A;--g2:#14193A;--gl:#EEF0F5;--y:#D7F25C;--yl:#F4FBD6;--o:#14193A;--r:#B4232F;--rl:#FBECEC;--ink:#14193A;--mut:#555B73;--line:#DDE0E8;--bg:#EEF0F5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Thmanyah,system-ui,sans-serif;color:var(--ink);font-size:17px;line-height:1.7;min-height:100vh}
header{background:var(--g);color:#fff;padding:14px 16px 18px}
.brand{font-weight:900;font-size:22px;display:flex;align-items:center;gap:8px}.brand svg{width:28px;height:28px}
.sub{font-size:14px;opacity:.92}
main{max-width:640px;margin:-10px auto 0;padding:0 16px 40px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:18px 16px;margin-top:0}
h1{font-weight:900;font-size:24px;color:var(--g);line-height:1.3}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--g);color:#fff;font:inherit;font-weight:700;font-size:18px;padding:12px;margin-top:14px;cursor:pointer}
.btn.sec{background:var(--gl);color:var(--g)}
.btn:disabled{opacity:.45;cursor:default}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-bottom:6px}
.bar{height:8px;background:var(--gl);border-radius:8px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--y);width:0;transition:width .3s}
.qt{font-weight:700;font-size:19px;margin-bottom:12px}
.tag{display:inline-block;font-size:12px;background:#f1ebf8;color:#7a4bb0;border-radius:20px;padding:0 8px;font-weight:700;margin-bottom:6px}
.opt{display:block;width:100%;text-align:right;font:inherit;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer;color:var(--ink)}
.opt:not(:disabled):active{background:var(--gl)}
.opt.ok{border-color:var(--g);background:var(--yl);font-weight:700}
.opt.bad{border-color:var(--r);background:var(--rl)}
.fb{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:16px}
.fb.ok{background:var(--yl)}.fb.bad{background:var(--rl)}
.fb b{display:block}
.score{font-size:46px;font-weight:900;color:var(--g);text-align:center;line-height:1.2;margin:8px 0}
.msg{text-align:center;font-weight:700}
.rev{margin-top:14px}.rev li{margin:8px 18px 0 0;font-size:15px}
ol{list-style:arabic-indic}
.rev .a{color:var(--g);font-weight:700}
footer{text-align:center;font-size:12px;color:var(--mut);padding:10px 16px 24px}
</style>

"e": "التجوية تفتّت الصخور في مكانها؛ فالماء يزداد حجمه عندما يتجمّد فيضغط على جوانب الشقّ."
}
];

const app=document.getElementById('app');
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
let order,i,score,wrong;
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function start(){
  app.innerHTML=`<h1>اختبار الوحدة الثالثة: الأرض ومواردها</h1>
  <p style="margin-top:8px">يجمع أهمّ أسئلة دروس الوحدة</p>
  <p style="margin-top:8px">اختبار تجميعي: معظم أسئلته مختارة من اختبارات الدروس، وأضيفت إليه أسئلة جديدة على الرسوم والجداول.</p>
  <p style="margin-top:8px;color:var(--mut)">${ar(Q.length)} سؤالًا${Q.some(q=>q.open)?' (منها '+ar(Q.filter(q=>q.open).length)+' سؤال مفتوح لا يُحسب في الدرجة)':''} تظهر واحدًا تلو الآخر. بعد كل إجابة ستعرف إن كانت صحيحة مع شرح قصير، وفي النهاية تظهر نتيجتك.</p>
  <button class="btn" id="go">ابدأ الاختبار</button>`;
  document.getElementById('go').onclick=()=>{order=Q.map((q,k)=>k);i=0;score=0;wrong=[];show()};
}
function show(){
  const q=Q[order[i]];
  const opts=q.open?[]:(q.fixed?q.o.map((t,k)=>[t,k]):shuffle(q.o.map((t,k)=>[t,k])));
  const img=q.img?`<img src="${q.img}" alt="الشكل" style="width:100%;border-radius:12px;margin:0 0 10px;display:block">`:'';
  const body=q.open?`<div class="tag" style="background:#E6F4EA;color:#1C7C3A">سؤال مفتوح · لا يُحسب في الدرجة</div><div class="qt">${q.q}</div>${img}
  <textarea id="ta" rows="3" style="width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:8px" placeholder="اكتب إجابتك هنا…"></textarea>
  <button class="btn sec" id="sk">أظهر مفتاح التعليل</button><div id="fb"></div>`
  :`${q.b?'<span class="tag">من أسئلة الكتاب</span>':''}
  <div class="qt">${q.q}</div>${img}
  <div id="opts">${opts.map(([t,k])=>`<button class="opt" data-k="${k}">${t}</button>`).join('')}</div>
  <div id="fb"></div>`;
  app.innerHTML=`<div class="prog"><span>السؤال ${ar(i+1)} من ${ar(Q.length)}</span><span id="sc">الصحيحة: ${ar(score)}</span></div>
  <div class="bar"><i style="width:${i/Q.length*100}%"></i></div>${body}`;
  if(q.open){document.getElementById('sk').onclick=()=>openKey(q);return}
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b,q));
}
function openKey(q){
  document.getElementById('sk').disabled=true;
  const last=i===Q.length-1;
  document.getElementById('fb').innerHTML=`<div class="fb ok"><b>مفتاح التعليل:</b>${q.e}</div>
  <button class="btn" id="nx">${last?'عرض النتيجة':'السؤال التالي'}</button>`;
  document.getElementById('nx').onclick=()=>{i++;last?result():show()};
}
function answer(btn,q){
  const k=+btn.dataset.k, ok=k===0;
  app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.k===0)b.classList.add('ok')});
  if(ok)score++;else{btn.classList.add('bad');wrong.push(order[i])}
  document.getElementById('sc').textContent='الصحيحة: '+ar(score);
  const last=i===Q.length-1;
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'إجابة صحيحة، أحسنت! 🌟':'ليست الإجابة الصحيحة.'}</b>${q.e}</div>
  <button class="btn" id="nx">${last?'عرض النتيجة':'السؤال التالي'}</button>`;
  document.getElementById('nx').onclick=()=>{i++;last?result():show()};
}
function result(){
  const NS=Q.filter(q=>!q.open).length;const pct=Math.round(score/NS*100);
  const msg=pct>=90?'أتقنت معظم أسئلة هذا التدريب؛ راجع أيضًا أسئلة الكتاب والرسوم والمهارات 👍':pct>=70?'جيد جدًّا، راجع الأسئلة التي أخطأت فيها 👍':'راجع الملخص مرّة أخرى ثم أعد المحاولة 💪';
  app.innerHTML=`<h1>نتيجتك</h1>
  <div class="score">${ar(score)} / ${ar(NS)}</div>
  <p class="msg">${msg}</p>
  ${wrong.length?`<div class="rev"><b>راجع هذه الأسئلة:</b><ol>${wrong.map(k=>`<li>${Q[k].q}<br><span class="a">الإجابة: ${Q[k].o[0]}</span></li>`).join('')}</ol></div>`:''}
  <button class="btn" id="again">إعادة الاختبار</button>`;
  document.getElementById('again').onclick=start;
}
start();
</script>
</body>
</html>
